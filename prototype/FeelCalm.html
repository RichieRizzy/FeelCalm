<title>FeelCalm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout concept: one phone-width column (max 430px), centred on larger screens. Black ink panels carry live data, one blue marks everything that moves. */
:root{
  --bg:#FFFFFF;--fg:#0B0B0C;--muted:#6B6B72;--card:#F4F4F5;--line:#E7E7EA;
  --accent:#2347FF;--on-accent:#FFFFFF;--accent-soft:rgba(35,71,255,.10);
  --ink:#0B0B0C;--ink-fg:#FFFFFF;--ink-muted:#A1A1A8;--ink-card:#1A1A1D;--seg-off:#2A2A2E;
  --btn:#0B0B0C;--btn-fg:#FFFFFF;--logo:#0B0B0C;--off:#CFCFD4;
  --map:#ECEDF0;--map-block:#E1E3E8;--map-road:#FFFFFF;--shadow:rgba(11,11,12,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0B0C;--fg:#F4F4F5;--muted:#A1A1A8;--card:#17171A;--line:#26262B;
  --accent:#6C88FF;--on-accent:#0B0B0C;--accent-soft:rgba(108,136,255,.16);
  --ink:#1D1D21;--ink-fg:#FFFFFF;--ink-muted:#A1A1A8;--ink-card:#2A2A2F;--seg-off:#3A3A40;
  --btn:#F4F4F5;--btn-fg:#0B0B0C;--logo:#26262B;--off:#3A3A40;
  --map:#18181B;--map-block:#202024;--map-road:#2C2C32;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0B0C;--fg:#F4F4F5;--muted:#A1A1A8;--card:#17171A;--line:#26262B;
  --accent:#6C88FF;--on-accent:#0B0B0C;--accent-soft:rgba(108,136,255,.16);
  --ink:#1D1D21;--ink-fg:#FFFFFF;--ink-muted:#A1A1A8;--ink-card:#2A2A2F;--seg-off:#3A3A40;
  --btn:#F4F4F5;--btn-fg:#0B0B0C;--logo:#26262B;--off:#3A3A40;
  --map:#18181B;--map-block:#202024;--map-road:#2C2C32;--shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input{cursor:text}
input::placeholder{color:var(--muted);opacity:.8}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:430px;margin:0 auto;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.col{display:flex;flex-direction:column}.row{display:flex;align-items:center}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}
.f1{flex:1;min-width:0}.nos{flex-shrink:0}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.center{justify-content:center;align-items:center;text-align:center}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--muted)}.small{font-size:12px;line-height:17px}.tiny{font-size:11px}
.b{font-weight:700}.xb{font-weight:800}
.h1{font-size:26px;font-weight:800;line-height:32px}.h2{font-size:17px;font-weight:800}.h3{font-size:15px;font-weight:800}
.num{font-variant-numeric:tabular-nums}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:24px}
.scroll.nav{padding-bottom:112px}
.scroll>*{flex-shrink:0}
.brand{font-weight:800;letter-spacing:-.3px}.brand b{color:var(--accent)}
.card{background:var(--card);border-radius:22px;padding:16px 18px}
.outline{border:1px solid var(--line);border-radius:24px;padding:18px}
.dashed{border:1.5px dashed var(--off);border-radius:24px;padding:24px 18px;text-align:center}
.ink{background:var(--ink);color:var(--ink-fg);border-radius:28px;padding:20px}
.ink .muted,.ink .mut{color:var(--ink-muted)}
.inp{width:100%;height:56px;border-radius:28px;border:1px solid var(--line);background:var(--card);padding:0 22px;font-size:14px;font-weight:500;outline:0;color:var(--fg)}
.inp:focus{border-color:var(--accent)}
.lab{font-size:12px;font-weight:600;color:var(--muted);padding-left:8px}
.btn{height:56px;border-radius:28px;font-weight:700;font-size:15px;padding:0 22px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;text-align:center}
.btn.sm{height:44px;border-radius:22px;font-size:13px;width:auto;padding:0 18px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--btn);color:var(--btn-fg)}
.btn.soft{background:var(--card);color:var(--fg)}
.btn.onink{background:var(--ink-card);color:var(--ink-fg)}
.btn.white{background:#fff;color:#0B0B0C}
.btn[disabled]{opacity:.5;cursor:default}
.circ{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:var(--card);flex-shrink:0}
.circ.acc{background:var(--accent);color:var(--on-accent)}.circ.dk{background:var(--btn);color:var(--btn-fg)}.circ.wh{background:#fff;color:#0B0B0C}
.circ.off{background:var(--off);color:#fff;pointer-events:none}
.badge{background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;border-radius:14px;padding:6px 12px;white-space:nowrap}
.badge.solid{background:var(--accent);color:var(--on-accent)}
.opt{border-radius:20px;padding:14px 10px;background:var(--card);display:flex;flex-direction:column;gap:4px;text-align:left}
.opt.on{background:var(--btn);color:var(--btn-fg)}
.opt .s{font-size:11px;font-weight:500;opacity:.7}.opt .p{font-size:13px;font-weight:800;margin-top:4px}
.opt .t{font-size:13px;font-weight:800}
.pill{height:44px;border-radius:22px;padding:0 18px;background:var(--card);font-size:13px;font-weight:700;display:flex;align-items:center}
.pill.on{background:var(--btn);color:var(--btn-fg)}
.seg2{display:flex;height:56px;border-radius:28px;background:var(--card);padding:4px}
.seg2 button{flex:1;border-radius:24px;font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.seg2 button.on{background:var(--btn);color:var(--btn-fg)}
.tog{position:relative;width:52px;height:30px;border-radius:15px;background:var(--off);flex-shrink:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .2s}
.tog.on{background:var(--accent)}.tog.on::after{left:25px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qa{height:92px;border-radius:22px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:600;position:relative}
.dot{width:8px;height:8px;border-radius:4px;background:var(--accent);display:inline-block;flex-shrink:0}
.unread{position:absolute;top:12px;right:14px;width:10px;height:10px;border-radius:5px;background:var(--accent)}
.bar{position:relative;height:6px;border-radius:3px;background:var(--line)}.bar i{position:absolute;left:0;top:0;height:6px;border-radius:3px;background:var(--accent)}
.segs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.segs i{height:6px;border-radius:3px;background:var(--seg-off)}.segs i.on{background:var(--accent)}
.navbar{position:absolute;left:24px;right:24px;bottom:16px;height:68px;border-radius:34px;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 10px;box-shadow:0 12px 28px var(--shadow)}
.navbar button{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);position:relative}
.navbar button.on{background:var(--accent);color:var(--on-accent)}
.trackwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.mapbox{flex:1;min-height:220px;position:relative;background:var(--map);overflow:hidden}
.mapbox svg.map{position:absolute;inset:0;width:100%;height:100%;display:block}
.mb{fill:var(--map-block)}.mr{stroke:var(--map-road);fill:none;stroke-linecap:round}
.mapbtn{position:absolute;top:16px;left:24px}
.mappill{position:absolute;top:16px;right:24px;height:44px;border-radius:22px;background:var(--bg);color:var(--fg);padding:0 16px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;box-shadow:0 6px 18px var(--shadow)}
.mapbtn .circ{background:var(--bg);box-shadow:0 6px 18px var(--shadow)}
.sheet{flex:none;max-height:64%;overflow-y:auto;background:var(--ink);color:var(--ink-fg);border-radius:32px 32px 0 0;padding:12px 24px 24px;display:flex;flex-direction:column;gap:16px;margin-top:-28px;position:relative}
.sheet>*{flex-shrink:0}
.grab{align-self:center;width:44px;height:4px;border-radius:2px;background:var(--seg-off)}
.sheet .muted{color:var(--ink-muted)}
.sheet .inp{background:var(--ink-card);border-color:transparent;color:var(--ink-fg)}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.45}100%{transform:scale(2.2);opacity:0}}
.chatlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 0}
.msg{max-width:260px;display:flex;flex-direction:column;gap:4px}
.msg span.t{font-size:14px;line-height:20px;font-weight:500;padding:12px 16px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}.msg.me span.t{background:var(--accent);color:var(--on-accent);border-radius:20px 20px 6px 20px}
.msg.them{align-self:flex-start}.msg.them span.t{background:var(--card);border-radius:20px 20px 20px 6px}
.chip{border:1px solid var(--line);border-radius:20px;height:40px;padding:0 14px;font-size:13px;font-weight:600;display:flex;align-items:center}
.composer{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:32px;height:60px;padding:0 8px 0 20px}
.composer input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:14px;font-weight:500}
.overlay{position:absolute;inset:0;background:rgba(11,11,12,.55);display:flex;align-items:flex-end;z-index:5}
.osheet{width:100%;background:var(--bg);border-radius:32px 32px 0 0;padding:12px 24px 28px;display:flex;flex-direction:column;gap:16px;max-height:88%;overflow-y:auto}
.osheet .grab{background:var(--line)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(382px,calc(100% - 32px));z-index:20;background:var(--ink);color:var(--ink-fg);border-radius:24px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;box-shadow:0 10px 24px var(--shadow)}
#toast[hidden]{display:none}
.banner{border:1px solid var(--accent);background:var(--accent-soft);border-radius:22px;padding:14px 16px;font-size:13px;line-height:18px;font-weight:600}
.tl{position:relative;padding-left:36px;display:flex;justify-content:space-between;gap:12px}
.tl .d{position:absolute;left:0;top:3px;width:20px;height:20px;border-radius:10px;background:var(--line);display:flex;align-items:center;justify-content:center;color:#fff}
.tl.done .d{background:var(--btn);color:var(--btn-fg)}.tl.now .d{background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.pin{font-size:30px;font-weight:800;letter-spacing:6px}
.stars{display:flex;justify-content:center;gap:8px}
.star{width:52px;height:52px;border-radius:26px;background:var(--card);display:flex;align-items:center;justify-content:center}
.star svg{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linejoin:round}.star.on svg{fill:var(--accent);stroke:var(--accent)}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.tog::after{transition:none}}
</style>
<div id="app" aria-live="polite"></div>
<div id="toast" role="status" hidden></div>

function ico(n, s) { s = s || 22; return '<svg class="i" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" aria-hidden="true">' + IC[n] + '</svg>'; }

  return '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 64 64" role="img" aria-label="FeelCalm logo"><rect width="64" height="64" rx="18" style="fill:var(--logo)"/><path d="M32 9c-8.6 0-14.5 6.3-14.5 14 0 10 11 19.5 14.5 22.3 3.5-2.8 14.5-12.3 14.5-22.3C46.5 15.3 40.6 9 32 9z" fill="#2347FF"/><circle cx="32" cy="23" r="5.5" fill="#fff"/><path d="M14 54c4-3.4 8-3.4 12 0s8 3.4 12 0 8-3.4 12 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>';
}

/* ---------------------------------------------------------------- helpers */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function digits(p) { return String(p || '').replace(/[^0-9+]/g, ''); }

function timeNow() { return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

function quoteRows(q, service) {
  var r = [['Delivery · ' + q.zoneLabel + ' · ' + service, money(q.delivery)], ['Package · ' + q.sizeLabel, q.size ? money(q.size) : 'Included'], ['Service fee', money(q.fee)]];

function pathPoint(rp) {

async function hashPin(id, pin) {

/* ---------------------------------------------------------------- state */
var S = {
  db: null, user: null, room: null, uid: null, canWrite: null, boot: 'loading',
  profile: undefined, role: 'customer', wRole: 'customer', veh: 'Motorbike',
  screen: 'home', cur: null, drafts: {}, form: { zone: 'city', size: 'small', service: 'Standard', pay: 'Card', insured: false },
  mine: {}, follow: {}, job: {}, open: {}, pins: {}, msgs: [], peers: [],
  online: true, safety: false, receipt: null, rating: 0, tip: 0, err: '', findMsg: '',
  myPos: { x: 322, y: 206 }, rp: null, rpShip: null, readTs: 0, lastPres: '', busy: false
};
var $app = document.getElementById('app');
var $toast = document.getElementById('toast');
var subs = [], followSubs = {}, msgSub = null, msgFor = null, profSub = null;
var toastT = null, typeT = null, renderQ = false, lastScreen = '';

function D(id, fb) { return S.drafts[id] != null ? S.drafts[id] : (fb == null ? '' : fb); }
function P() { return 'data/users/' + S.uid + '/profile'; }
function ship(id) { return S.mine[id] || S.job[id] || S.follow[id] || S.open[id]; }
function toast(msg) {
  $toast.textContent = msg; $toast.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function () { $toast.hidden = true; }, 3600);
}
function notify(msg, important) { if (S.profile && S.profile.calm !== false && !important) return; toast(msg); }
function fail(e) { toast((e && e.code === 'invalid_argument') ? 'You need Contributor access to save. Ask the owner to share it with you.' : 'Something went wrong. Check your connection and try again.'); }

function curShip() {
  var k, s;
  if (S.role === 'rider') {
    for (k in S.job) { s = S.job[k]; if (s.stage >= 1 && s.stage <= 3) { S.cur = s.id; return s; } }
    s = S.cur && S.job[S.cur]; return (s && s.stage === 4) ? s : null;
  }
  if (S.cur && ship(S.cur)) return ship(S.cur);

  for (k in all) { s = all[k]; if (s.stage >= 0 && (s.stage < 4 || !s.rated)) list.push(s); }
  list.sort(function (a, b) { return (b.created || 0) - (a.created || 0); });
  S.cur = list[0] ? list[0].id : null;
  return list[0] || null;

/* ---------------------------------------------------------------- live data */
function sigOf(d) { var c = Object.assign({}, d); c.rp = 0; return JSON.stringify(c); }
function applyShip(map, id, data, announce) {
  var old = map[id]; map[id] = data;
  if (old && old.stage !== data.stage) stageChanged(data);
  else if (!old && announce && S.role === 'rider' && data.stage === 0 && S.online) notify('New delivery request nearby', true);
  return !old || sigOf(old) !== sigOf(data);
}
function stageChanged(sh) {
  if (S.role === 'customer' && (sh.senderId === S.uid || S.follow[sh.id])) {
    var t = ['', 'Rider assigned and heading to pickup', 'Package picked up and on the way', 'Your rider has arrived. Share your PIN', 'Delivered. Thank you!'][sh.stage];
    if (t) notify(t, sh.stage >= 2);

  }
}
function watch(q, map) {

    var need = false, announce = !first;
    first = false;

      var id = ch.doc.id;
      if (ch.type === 'removed') { delete map[id]; need = true; } else if (applyShip(map, id, ch.doc.data(), announce)) need = true;
    });

}
function resub() {
  subs.forEach(function (u) { u(); }); subs = []; S.mine = {}; S.job = {}; S.open = {};
  if (!S.profile || !S.db) return;
  var ship = S.db.collection('shipments');
  subs.push(watch(ship.where('senderId', '==', S.uid), S.mine));
  subs.push(watch(ship.where('riderId', '==', S.uid), S.job));
  if (S.role === 'rider' && S.online) subs.push(watch(ship.where('stage', '==', 0).limit(20), S.open));
}
function syncFollows() {
  var ids = (S.profile && S.profile.follows) || [], id;
  for (id in followSubs) if (ids.indexOf(id) < 0) { followSubs[id](); delete followSubs[id]; delete S.follow[id]; }
  ids.forEach(function (fid) {
    if (followSubs[fid]) return;
    followSubs[fid] = S.db.doc('shipments/' + fid).onSnapshot(function (s) {
      if (s.exists) { if (applyShip(S.follow, fid, s.data())) scheduleRender(); else updateMap(); } else { delete S.follow[fid]; scheduleRender(); }
    }, fail);
  });
}
function syncMsgs() {

  msgFor = id; S.msgs = [];

  msgSub = S.db.collection('shipments/' + id + '/messages').orderBy('ts', 'desc').limit(50).onSnapshot(function (snap) {
    S.msgs = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).reverse();
    if (S.screen === 'chat') renderChatList(); else scheduleRender();
  }, fail);

/* ---------------------------------------------------------------- rider simulation */
setInterval(function () {

  if (S.rpShip !== sh.id) { S.rpShip = sh.id; S.rp = sh.rp || 0; }
  var target = sh.stage === 1 ? PICK : 1, rp = S.rp;
  if (sh.stage === 2 && rp < PICK) rp = PICK;
  if (rp >= target) return;
  var next = Math.min(target, rp + 0.02); S.rp = next;
  if (S.room && S.profile.share !== false) S.room.presence({ ship: sh.id, role: 'rider', rp: next }).catch(function () {});
  updateMap();
  var reached = next >= target;
  if (!S.writing && (reached || Math.round(next * 100) % 6 === 0)) {
    S.writing = true;
    S.db.doc('shipments/' + sh.id).update({ rp: next }).catch(function () {}).then(function () { S.writing = false; });
  }
  if (reached) scheduleRender();
}, 1000);

/* ---------------------------------------------------------------- actions */
async function guard(fn) {
  if (S.busy) return; S.busy = true; scheduleRender();
  try { await fn(); } catch (e) { fail(e); } finally { S.busy = false; scheduleRender(); }
}
var A = {
  go: function (d) { if (d.to === 'chat') S.readTs = Date.now(); if (d.to === 'rate') { S.rating = 0; S.tip = 0; } S.err = ''; S.screen = d.to; render(); },
  wRole: function (d) { S.wRole = d.r; S.err = ''; render(); },
  setVeh: function (d) { S.veh = d.v; S.drafts['p-veh'] = d.v; render(); },
  createProfile: function () {
    var name = D('w-name').trim(), phone = D('w-phone').trim();
    if (!name || !phone) { S.err = 'Enter your name and phone number to continue.'; render(); return; }
    var cust = S.wRole === 'customer';
    return guard(async function () {
      await S.db.doc(P()).set({ role: S.wRole, name: name, phone: phone, address: cust ? D('w-address').trim() : '', vehicle: S.veh, plate: cust ? '' : D('w-plate').trim(), calm: true, share: true, follows: [], created: Date.now() });
      S.role = S.wRole; S.err = ''; ['w-name', 'w-phone', 'w-address', 'w-plate'].forEach(function (k) { delete S.drafts[k]; });
    });
  },
  saveProfile: function () {
    var rider = S.role === 'rider', patch = { name: D('p-name', S.profile.name).trim(), phone: D('p-phone', S.profile.phone).trim() };
    if (!patch.name) { toast('Your name cannot be empty.'); return; }
    if (rider) { patch.vehicle = D('p-veh', S.profile.vehicle || 'Motorbike'); patch.plate = D('p-plate', S.profile.plate).trim(); } else patch.address = D('p-address', S.profile.address).trim();
    return guard(async function () { await S.db.doc(P()).update(patch); ['p-name', 'p-phone', 'p-plate', 'p-address', 'p-veh'].forEach(function (k) { delete S.drafts[k]; }); toast('Saved'); });
  },
  toggleCalm: function () { return S.db.doc(P()).update({ calm: S.profile.calm === false }).catch(fail); },
  toggleShare: function () { S.lastPres = ''; return S.db.doc(P()).update({ share: S.profile.share === false }).catch(fail); },
  switchRole: function () { S.role = S.role === 'rider' ? 'customer' : 'rider'; S.cur = null; S.screen = 'home'; S.lastPres = ''; resub(); render(); },
  toggleOnline: function () { S.online = !S.online; resub(); render(); },
  setForm: function (d) { S.form[d.k] = d.v; render(); },
  toggleIns: function () { S.form.insured = !S.form.insured; render(); },
  findShip: function () {
    var id = D('t-id').trim().toUpperCase();
    if (!id) { S.findMsg = 'Type a tracking ID first.'; render(); return; }
    return guard(async function () {
      var snap = await S.db.doc('shipments/' + id).get();
      if (!snap.exists) { S.findMsg = 'No shipment found for ' + id + '.'; return; }
      var follows = [id].concat((S.profile.follows || []).filter(function (x) { return x !== id; })).slice(0, 5);
      await S.db.doc(P()).update({ follows: follows });
      S.findMsg = ''; delete S.drafts['t-id']; S.cur = id; S.screen = 'track';
    });
  },
  openShip: function (d) { var sh = ship(d.id); if (!sh) return; S.cur = d.id; S.screen = (sh.stage === 4 && !sh.rated && S.role === 'customer') ? 'rate' : 'track'; if (S.screen === 'rate') { S.rating = 0; S.tip = 0; } render(); },
  createShip: function () {
    var f = S.form, v = function (id, fb) { return D(id, fb).trim(); };
    var item = v('n-item'), from = v('n-from', S.profile.address), to = v('n-to'), rn = v('n-rn'), rp = v('n-rp');
    if (!item || !from || !to || !rn || !rp) { S.err = "Add the item, both addresses and the receiver's name and phone."; render(); return; }
    return guard(async function () {
      var id = 'FC-' + String(Math.floor(10000 + Math.random() * 90000)), pin = String(Math.floor(1000 + Math.random() * 9000)), q = quote(f);
      var doc = { id: id, senderId: S.uid, senderName: S.profile.name, senderPhone: S.profile.phone, item: item, from: from, to: to, rName: rn, rPhone: rp, size: f.size, zone: f.zone, service: f.service, pay: f.pay, insured: f.insured, note: v('n-note'), q: q, pinHash: await hashPin(id, pin), stage: 0, rp: 0, rated: false, tip: 0, created: Date.now(), riderId: '' };
      await S.db.doc('shipments/' + id).set(doc);
      await S.db.doc('data/users/' + S.uid + '/pin_' + id).set({ pin: pin });
      S.pins[id] = pin; S.cur = id; S.err = ''; S.screen = 'track'; S.mine[id] = doc;
      ['n-item', 'n-from', 'n-to', 'n-rn', 'n-rp', 'n-note'].forEach(function (k) { delete S.drafts[k]; });
      toast('Shipment confirmed. Finding a rider nearby.');
    });
  },
  cancelShip: function () { var sh = curShip(); if (!sh || sh.stage > 1) return; return guard(async function () { await S.db.doc('shipments/' + sh.id).update({ stage: -1 }); S.cur = null; S.screen = 'home'; toast('Shipment cancelled. No charge.'); }); },
  accept: function (d) {
    return guard(async function () {
      var ref = S.db.doc('shipments/' + d.id), lease = await ref.acquire({ holder: S.uid, ttlMs: 5000 });
      if (!lease.acquired) { toast('Another rider is taking this request.'); return; }
      var s = await ref.get(), x = s.data();
      if (!x || x.stage !== 0) { toast('That request is no longer available.'); return; }
      await ref.update({ stage: 1, riderId: S.uid, riderName: S.profile.name, riderPhone: S.profile.phone, riderVehicle: S.profile.vehicle || 'Motorbike', rp: 0, assignedAt: Date.now() });
      S.rpShip = d.id; S.rp = 0; S.cur = d.id; S.screen = 'track';
    });
  },
  picked: function () { var sh = curShip(); if (sh) return S.db.doc('shipments/' + sh.id).update({ stage: 2, pickedAt: Date.now(), rp: S.rp }).catch(fail); },
  arrived: function () { var sh = curShip(); if (sh) return S.db.doc('shipments/' + sh.id).update({ stage: 3, arrivedAt: Date.now(), rp: 1 }).catch(fail); },
  confirmPin: function () {
    var sh = curShip(), pin = D('r-pin').trim(); if (!sh) return;
    return guard(async function () {
      if ((await hashPin(sh.id, pin)) !== sh.pinHash) { S.err = 'That PIN does not match. Ask the receiver again.'; return; }
      S.err = ''; delete S.drafts['r-pin'];
      await S.db.doc('shipments/' + sh.id).update({ stage: 4, deliveredAt: Date.now() });
      S.cur = sh.id;
    });
  },
  riderDone: function () { S.cur = null; S.rp = null; S.rpShip = null; S.screen = 'home'; render(); },
  setRating: function (d) { S.rating = +d.n; render(); },
  setTip: function (d) { S.tip = +d.v; render(); },
  submitRating: function () {
    var sh = curShip(); if (!sh) return;
    return guard(async function () {
      await S.db.doc('shipments/' + sh.id).update({ rated: true, rating: S.rating, tip: S.tip, comment: D('rt-c').trim() });
      delete S.drafts['rt-c']; S.cur = null; S.screen = 'home'; toast('Thanks for the feedback!');
    });
  },
  receipt: function (d) { S.receipt = d.id; render(); },
  closeOv: function () { S.safety = false; S.receipt = null; render(); },
  openSafety: function () { S.safety = true; render(); },
  shareTrip: function () {
    var sh = curShip(); if (!sh) return;
    var txt = 'Track my FeelCalm delivery: ' + sh.id;
    try { navigator.clipboard.writeText(txt).then(function () { toast('Tracking ID copied: ' + sh.id); }, function () { toast(txt); }); } catch (e) { toast(txt); }
  },
  sendChip: function (d) { return sendMsg(d.t); },
  sendChat: function () { return sendMsg(D('c-msg')); }
};
async function sendMsg(text) {
  var t = String(text || '').trim(), sh = curShip();
  if (!t || !sh || sh.stage < 1) return;
  delete S.drafts['c-msg'];
  var inp = document.getElementById('c-msg'); if (inp) inp.value = '';
  if (S.room) S.room.presence({ typing: null }).catch(function () {});
  try { await S.db.collection('shipments/' + sh.id + '/messages').add({ by: S.uid, role: S.role, text: t.slice(0, 500), time: timeNow(), ts: Date.now() }); } catch (e) { fail(e); }
}

$app.addEventListener('click', function (e) {
  var svg = e.target.closest && e.target.closest('svg.map');
  if (svg && S.role === 'customer' && S.screen === 'track' && !e.target.closest('[data-act]')) {
    var sh = curShip(); if (!sh || sh.stage >= 4 || !svg.getScreenCTM) return;
    var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    var m = pt.matrixTransform(svg.getScreenCTM().inverse());
    S.myPos = { x: Math.max(10, Math.min(380, m.x)), y: Math.max(60, Math.min(510, m.y)) };
    if (S.profile && S.profile.share === false) { toast('Turn on location to share your pin.'); return; }
    S.lastPres = ''; syncPresence(); updateMap(); return;
  }
  var el = e.target.closest && e.target.closest('[data-act]'); if (!el || el.disabled) return;
  var fn = A[el.getAttribute('data-act')]; if (!fn) return;
  var d = {}; Array.prototype.forEach.call(el.attributes, function (a) { if (a.name.indexOf('data-') === 0) d[a.name.slice(5)] = a.value; });
  fn(d);
});
$app.addEventListener('input', function (e) {
  var t = e.target; if (!t.id) return;
  S.drafts[t.id] = t.value;
  if (t.id === 'c-msg' && S.room) {
    S.room.presence({ typing: true }).catch(function () {});
    clearTimeout(typeT); typeT = setTimeout(function () { S.room.presence({ typing: null }).catch(function () {}); }, 2500);
  }
});
$app.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  var a = e.target.getAttribute && e.target.getAttribute('data-enter'); if (a && A[a]) { e.preventDefault(); A[a]({}); }
});

/* ---------------------------------------------------------------- boot */
async function boot() {
  render();
  var c = window.claude;
  if (!c || !c.use) { S.boot = 'nodb'; render(); return; }
  var res = await Promise.all([c.use('db'), c.use('user'), c.use('room')]);
  S.db = res[0]; S.user = res[1]; S.room = res[2];
  if (!S.db) { S.boot = 'nodb'; render(); return; }
  S.uid = S.user ? await S.user.id() : null;
  if (!S.uid) { S.boot = 'nouser'; render(); return; }
  S.canWrite = await S.user.can('data.write');
  S.boot = 'ready';
  if (S.room) S.room.onPeers(function (ch) { S.peers = ch.peers.slice(); updateMap(); });
  profSub = S.db.doc(P()).onSnapshot(function (snap) {
    var had = !!S.profile, first = S.profile === undefined;
    S.profile = snap.exists ? snap.data() : false;
    if (first && S.profile) { S.role = S.profile.role === 'rider' ? 'rider' : 'customer'; S.veh = S.profile.vehicle || 'Motorbike'; }
    if (!!S.profile !== had) resub();
    syncFollows(); scheduleRender();
  }, fail);
  render();
}
setInterval(function () { var sh = curShip(); if (sh && S.role === 'customer') ensurePin(sh); }, 1500);
boot();
})();
</script>
